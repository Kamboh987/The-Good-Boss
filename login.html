<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - The Good Boss</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261124-8">
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <div class="login-logo"><span>T</span><span>B</span></div>
      <h1>The Good Boss</h1>
      <p>Learning and leadership portal</p>
    </section>
    <section class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in to continue to your portal</p>
      <form id="loginForm">
        <div class="form-field"><label>Email address</label><input id="loginEmail" type="email"
            value="margaret.mead@example.com" required></div>
        <div class="form-field"><label>Password</label><input id="loginPassword" type="password" value="password"
            required></div>
        <div class="login-options"><label><input type="checkbox" checked> Remember me</label><button type="button"
            class="forgot-btn">Forgot password?</button></div>
        <button class="login-submit" type="submit">Login</button>
      </form>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="assets/js/main.js?v=20261124-6"></script>
</body>

</html>
